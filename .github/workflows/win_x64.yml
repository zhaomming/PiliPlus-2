name: Build for Windows x64

on:
  push:
    branches: [ main, master ]
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

permissions: write-all

jobs:
  build-windows-app:
    name: Release Windows x64
    runs-on: windows-latest
    steps:
      - name: 启用 Git 长路径支持
        run: git config --global core.longpaths true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: |
          lib/scripts/patch.ps1 windows
          Set-Location $env:GITHUB_WORKSPACE

      - name: Set and Extract version
        shell: pwsh
        run: |
          lib/scripts/build.ps1
          Set-Location $env:GITHUB_WORKSPACE

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release --dart-define-from-file=pili_release.json

      - name: Compress Portable Zip
        shell: pwsh
        run: |
          7z a -r PiliPlus_windows_portable.zip ./build/windows/x64/runner/Release/*

      - name: Upload windows file release
        uses: actions/upload-artifact@v4
        with:
          name: Windows-portable-x64
          path: PiliPlus_windows_portable.zip

      - name: Release Portable Zip
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.0-portable
          name: PiliPlus-2 v2.1.0 便携版
          draft: false
          prerelease: false
          files: PiliPlus_windows_portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
